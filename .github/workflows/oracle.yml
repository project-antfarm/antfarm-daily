name: oracle
# Thin caller. Triggers live here; the job lives in antfarm-core, pinned by SHA.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (labelled done or blocked)
        required: true
permissions: {}
jobs:
  oracle:
    uses: project-antfarm/antfarm-core/.github/workflows/oracle.yml@7bf240a922b3ec9b0265e3569d06bf3e48e8a381
    with:
      core_ref: 7bf240a922b3ec9b0265e3569d06bf3e48e8a381
      issue: ${{ github.event.inputs.issue || '' }}
    secrets: inherit
