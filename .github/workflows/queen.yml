name: queen
on:
  schedule:
    - cron: "0 9,15,21 * * *"
  workflow_dispatch:
concurrency:
  group: queen
  cancel-in-progress: false
permissions: {}
env:
  COLONY_LOG_ISSUE: "1"
  GH_REPO: ${{ github.repository }}
jobs:
  queen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: read config
        id: cfg
        run: |
          for k in queen.model queen.max_turns queen.runs_per_day weekly_token_budget ready_max attempts_max lease_hours; do
            echo "${k//./_}=$(yq ".$k" .antfarm/config.yml)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.QUEEN_APP_ID }}
          private-key: ${{ secrets.QUEEN_APP_PRIVATE_KEY }}
      - name: guards and context
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ENABLED: ${{ vars.ANTFARM_ENABLED }}
          RUNS_PER_DAY: ${{ steps.cfg.outputs.queen_runs_per_day }}
          WEEKLY: ${{ steps.cfg.outputs.weekly_token_budget }}
          LEASE_HOURS: ${{ steps.cfg.outputs.lease_hours }}
        run: |
          skip() { echo "skip: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$ENABLED" = "true" ] || skip "kill switch off"
          [ "$(gh issue list --label done --state all --json number --jq length)" = "0" ] || skip "DONE declared"
          .antfarm/budget.sh queen "$RUNS_PER_DAY" "$WEEKLY" || skip "over budget"
          # lease: in-progress Issues without an open PR past the lease go back to ready
          for n in $(gh issue list --label in-progress --json number --jq '.[].number'); do
            [ "$(gh pr list --head "ant/issue-$n" --state open --json number --jq length)" = "0" ] || continue
            since=$(gh api "repos/$GH_REPO/issues/$n/events" --jq '[.[] | select(.event=="labeled" and .label.name=="in-progress")] | last | .created_at')
            age=$(( ( $(date -u +%s) - $(date -u -d "$since" +%s) ) / 3600 ))
            if [ "$age" -ge "$LEASE_HOURS" ]; then
              gh issue edit "$n" --remove-label in-progress --add-label ready
              gh issue comment "$n" --body "Lease expired after ${age}h without a PR. Back to ready."
            fi
          done
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Follow `.antfarm/queen.md` exactly. Repository: ${{ github.repository }}.
            Deployed site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            Limits set by the infrastructure (you cannot change them):
            - ready_max: ${{ steps.cfg.outputs.ready_max }} (Issues labelled ready or in-progress at once)
            - attempts_max: ${{ steps.cfg.outputs.attempts_max }} fix attempts per Issue before it is blocked
            - Queen runs today: ${{ steps.guard.outputs.runs_today }} of ${{ steps.cfg.outputs.queen_runs_per_day }} before this one
            - Tokens used by the colony this week: ${{ steps.guard.outputs.tokens_week }} of ${{ steps.cfg.outputs.weekly_token_budget }}
          claude_args: |
            --model ${{ steps.cfg.outputs.queen_model }}
            --max-turns ${{ steps.cfg.outputs.queen_max_turns }}
            --allowedTools "Bash(gh:*),Read,Glob,Grep,WebFetch"
            --json-schema '{"type":"object","properties":{"actions":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["actions","summary"]}'
      - name: log
        if: always() && steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MODEL: ${{ steps.cfg.outputs.queen_model }}
          SO: ${{ steps.claude.outputs.structured_output || '{}' }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion || 'failure' }}
          RUN: ${{ steps.guard.outputs.runs_today }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          extra=$(jq -n --arg c "$CONCLUSION" --argjson so "$SO" --arg r "$RUN" '{conclusion:$c, run_today:($r|tonumber)+1, result:$so}')
          .antfarm/log.sh queen "$MODEL" "$EXEC" "$extra"
