name: project-sync
# Thin caller. Triggers live here; the job lives in antfarm-core, pinned by SHA.
on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, reopened]
permissions: {}
jobs:
  sync:
    uses: project-antfarm/antfarm-core/.github/workflows/project-sync.yml@7bf240a922b3ec9b0265e3569d06bf3e48e8a381
    with:
      project_number: "1"
    secrets: inherit
