name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: conventional PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|test|ci|docs|refactor|chore|style|perf)(\([a-z0-9._/-]+\))?!?: .+'             || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        if: hashFiles('package.json') != ''
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present
      - name: test
        if: hashFiles('package.json') != ''
        run: npm test
      - name: no code yet
        if: hashFiles('package.json') == ''
        run: echo "no package.json; nothing to check"
