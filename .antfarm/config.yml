# Colony limits. Read by workflows, never by prompts. Human-owned.
# All counters are recomputed from the telemetry event files before any model
# starts, and only executions that consumed tokens count.
run: run-002
telemetry_repo: project-antfarm/antfarm-telemetry
queen:
  model: claude-opus-5
  max_turns: 30
  runs_per_day: 6
  # When woken by a finished CI run, wait until the external reviewer has
  # reviewed that commit, polling every 20s, for at most this many seconds.
  review_wait_max_seconds: 600
worker:
  model: claude-sonnet-5
  max_turns: 60
  runs_per_day: 6
# Weekly budget, counted since the last allowance reset (Sunday 16:00 UTC)
# across every run of this specimen. Two locks; either one stops every role.
budget:
  # Lock 1: conservative cost estimate in US dollars. Nothing is charged: this
  # is a yardstick built from API list prices to weigh token kinds. It
  # deliberately distrusts the cache: it assumes only `assumed_cache_share` of
  # the non-output tokens were billed at the cache-read price and the rest at
  # the full input price, whatever the run reported (typically about 95%).
  weekly_cost_usd: 54
  assumed_cache_share: 0.70
  # API list prices per million tokens, by model (cache read is 10% of input).
  # An unknown model is priced as the most expensive one listed.
  price_per_mtok:
    claude-opus-5: { input: 5, output: 25, cache_read: 0.50 }
    claude-sonnet-5: { input: 2, output: 10, cache_read: 0.20 }
    default: { input: 5, output: 25, cache_read: 0.50 }
  # Lock 2: raw token count, every kind counted as a full token.
  weekly_tokens: 45000000
ready_max: 1
attempts_max: 2
lease_hours: 4
