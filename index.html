<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="page">
  <header class="day-header">
    <div class="lang-switch" role="group" data-i18n-aria-label="langSwitchLabel">
      <button type="button" id="lang-pt-btn" class="lang-btn" aria-label="Português" aria-pressed="true">PT</button>
      <button type="button" id="lang-en-btn" class="lang-btn" aria-label="English" aria-pressed="false">EN</button>
    </div>
    <div class="day-header-top">
      <p class="eyebrow" id="day-eyebrow"></p>
      <div class="day-nav">
        <button type="button" id="prev-day" class="day-nav-btn" data-i18n-aria-label="prevDay">‹</button>
        <button type="button" id="today-btn" class="day-nav-btn day-nav-today" data-i18n="dayToday"></button>
        <button type="button" id="next-day" class="day-nav-btn" data-i18n-aria-label="nextDay">›</button>
      </div>
    </div>
    <h1 id="today-date"></h1>
    <div class="week-nav">
      <button type="button" id="prev-week" class="day-nav-btn" data-i18n-aria-label="prevWeek">«</button>
      <div class="week-strip" id="week-strip" role="group" data-i18n-aria-label="weekStrip"></div>
      <button type="button" id="next-week" class="day-nav-btn" data-i18n-aria-label="nextWeek">»</button>
    </div>
    <div class="day-jump">
      <label class="sr-only" for="jump-date-input" data-i18n="jumpDateLabel"></label>
      <input type="date" id="jump-date-input" class="day-jump-input">
    </div>
  </header>

  <main>
  <div class="panels">
    <section class="panel priorities-panel" aria-labelledby="priorities-heading">
      <div class="panel-head">
        <h2 id="priorities-heading" data-i18n="prioritiesHeading"></h2>
        <span class="panel-hint" data-i18n="prioritiesHint"></span>
      </div>
      <ul id="priorities-list" class="item-list priorities-list"></ul>
      <p id="priorities-empty" class="empty-state" data-i18n="prioritiesEmpty"></p>
      <form id="priority-form" class="add-form">
        <label class="sr-only" for="priority-input" data-i18n="priorityInputLabel"></label>
        <input id="priority-input" type="text" data-i18n-placeholder="priorityInputPlaceholder" autocomplete="off" maxlength="140">
        <button type="submit" data-i18n="add"></button>
      </form>
      <p id="priority-limit-msg" class="form-msg" role="status" hidden data-i18n="priorityLimitMsg">
      </p>
    </section>

    <section class="panel tasks-panel" aria-labelledby="tasks-heading">
      <div class="panel-head">
        <h2 id="tasks-heading" data-i18n="tasksHeading"></h2>
      </div>
      <ul id="tasks-list" class="item-list tasks-list"></ul>
      <p id="tasks-empty" class="empty-state" data-i18n="tasksEmpty"></p>
      <form id="task-form" class="add-form">
        <label class="sr-only" for="task-input" data-i18n="taskInputLabel"></label>
        <input id="task-input" type="text" data-i18n-placeholder="taskInputPlaceholder" autocomplete="off" maxlength="140">
        <button type="submit" data-i18n="add"></button>
      </form>
    </section>

    <section class="panel commitments-panel" aria-labelledby="commitments-heading">
      <div class="panel-head">
        <h2 id="commitments-heading" data-i18n="commitmentsHeading"></h2>
      </div>
      <ul id="commitments-list" class="item-list commitments-list"></ul>
      <p id="commitments-empty" class="empty-state" data-i18n="commitmentsEmpty"></p>
      <form id="commitment-form" class="add-form commitment-form">
        <div class="commitment-form-fields">
          <label class="sr-only" for="commitment-time-input" data-i18n="commitmentTimeLabel"></label>
          <input id="commitment-time-input" type="time">
          <label class="sr-only" for="commitment-input" data-i18n="commitmentInputLabel"></label>
          <input id="commitment-input" type="text" data-i18n-placeholder="commitmentInputPlaceholder" autocomplete="off" maxlength="140">
        </div>
        <button type="submit" data-i18n="add"></button>
      </form>
      <p id="commitment-msg" class="form-msg" role="status" hidden data-i18n="commitmentMsg">
      </p>
    </section>
  </div>

  <section class="notes-panel" aria-labelledby="notes-heading">
    <div class="panel-head">
      <h2 id="notes-heading" data-i18n="notesHeading"></h2>
    </div>
    <label class="sr-only" for="notes-input" data-i18n="notesInputLabel"></label>
    <textarea id="notes-input" class="notes-textarea" data-i18n-placeholder="notesInputPlaceholder" maxlength="2000" rows="4"></textarea>
  </section>

  <section class="panel unfinished-panel" aria-labelledby="unfinished-heading">
    <div class="panel-head">
      <h2 id="unfinished-heading" data-i18n="unfinishedHeading"></h2>
    </div>
    <p id="unfinished-summary" class="unfinished-summary" role="status"></p>
    <ul id="unfinished-list" class="item-list" aria-labelledby="unfinished-heading"></ul>
    <p id="unfinished-msg" class="form-msg" role="status" hidden data-i18n="unfinishedMsg">
    </p>
  </section>

  <section class="panel week-panel" aria-labelledby="week-heading">
    <div class="panel-head">
      <h2 id="week-heading"></h2>
    </div>

    <div class="week-progress">
      <p id="week-progress-text" class="week-progress-text"></p>
      <div class="progress-bar" aria-hidden="true">
        <div id="week-progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <h3 id="week-goals-heading" class="week-goals-heading" data-i18n="weekGoalsHeading"></h3>
    <ul id="week-goals-list" class="item-list goals-list" aria-labelledby="week-goals-heading"></ul>
    <p id="week-goals-empty" class="empty-state" data-i18n="weekGoalsEmpty"></p>
    <form id="goal-form" class="add-form">
      <label class="sr-only" for="goal-input" data-i18n="goalInputLabel"></label>
      <input id="goal-input" type="text" data-i18n-placeholder="goalInputPlaceholder" autocomplete="off" maxlength="140">
      <button type="submit" data-i18n="add"></button>
    </form>
    <p id="goal-msg" class="form-msg" role="status" hidden data-i18n="goalMsg">
    </p>
  </section>

  <section class="panel upcoming-panel" aria-labelledby="upcoming-heading">
    <div class="panel-head">
      <h2 id="upcoming-heading" data-i18n="upcomingHeading"></h2>
    </div>
    <p id="deadlines-summary" class="deadlines-summary" role="status"></p>
    <ul id="deadlines-list" class="item-list deadlines-list" aria-labelledby="upcoming-heading"></ul>
    <p id="deadlines-empty" class="empty-state" data-i18n="deadlinesEmpty"></p>
    <form id="deadline-form" class="add-form deadline-form">
      <div class="deadline-form-fields">
        <label class="sr-only" for="deadline-input" data-i18n="deadlineInputLabel"></label>
        <input id="deadline-input" type="text" data-i18n-placeholder="deadlineInputPlaceholder" autocomplete="off" maxlength="140">
        <label class="sr-only" for="deadline-due-input" data-i18n="deadlineDueLabel"></label>
        <input id="deadline-due-input" type="date">
      </div>
      <button type="submit" data-i18n="add"></button>
    </form>
    <p id="deadline-msg" class="form-msg" role="status" hidden data-i18n="deadlineMsg">
    </p>
  </section>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
